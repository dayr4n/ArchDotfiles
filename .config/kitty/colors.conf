# ╔══════════════════════════════════════════╗
# ║     COLORS — RED TEAM PURPLE GLASS        ║
# ║     Fondo morado oscuro · rojo brillante · azules   ║
# ╚══════════════════════════════════════════╝

# =========================
# EFECTO GLASS / BLUR (se mantiene)
# =========================
background_opacity   0.85
background_blur      20
dynamic_background_opacity yes

# Fondo: morado casi negro (mismo tono que tu Neovim), texto: lavanda claro
foreground           #eae6ea
background           #161119

# Cursor rojo brillante — el mismo rojo estrella del theme de nvim
cursor               #ff1744
cursor_text_color    #161119

# Selección: morado oscuro translúcido con texto claro
selection_foreground #eae6ea
selection_background #3a2c3d

# URLs: azul vivo para que contrasten sobre el morado
url_color            #4d9dff

# =========================
# BLACK / GRAYS — grises con tinte morado
# =========================
color0  #241b26   # negro — normal
color8  #6e6270   # gris medio — bright black (comentarios)

# =========================
# RED — el protagonista, rojo puro brillante
# =========================
color1  #ff1744
color9  #ff4569

# =========================
# GREEN — se mantiene funcional (git diffs, success) pero suavizado
# =========================
color2  #2fbf71
color10 #69f0ae

# =========================
# YELLOW — warm amber para warnings
# =========================
color3  #e6a817
color11 #ffca28

# =========================
# BLUE — azul vivo, el contraste frío frente al rojo/morado
# =========================
color4  #2f8fff
color12 #4d9dff

# =========================
# MAGENTA — morado/violeta, el puente entre el rojo y el azul
# =========================
color5  #a56bff
color13 #b388ff

# =========================
# CYAN — azul-verdoso frío
# =========================
color6  #3fc1c9
color14 #69e0f0

# =========================
# WHITE / TEXT
# =========================
color7  #b6a9c9
color15 #eae6ea

# =========================
# TAB BAR
# =========================
active_tab_foreground   #161119
active_tab_background   #ff1744
inactive_tab_foreground #6e6270
inactive_tab_background #1e1720
tab_bar_background      #0f0c11
