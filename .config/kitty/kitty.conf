# ╔══════════════════════════════════════════╗
# ║       KITTY — APPLE WHITE GLASS          ║
# ║       Arch Linux · blur · ninja cursor   ║
# ╚══════════════════════════════════════════╝

# =========================
# FONT
# =========================
font_family      SF Mono Bold
font_size        13.5
bold_font        auto
italic_font      auto
bold_italic_font auto

# Ligature / rendering suave
disable_ligatures never

# =========================
# GLASS / BLUR / TRANSPARENCY
# =========================
background_opacity 0.50

# blur real (requiere compositor con soporte de blur)
# — KDE/KWin: funciona out-of-the-box
# — Hyprland: añade "blur { enabled = true }" en tu hyprland.conf
# — X11 + picom: necesitas picom con backend glx y blur-method "dual_kawase"
background_blur 0

# =========================
# CURSOR — MODO NINJA ⚡
# =========================
cursor_trail 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
cursor_shape                 beam
cursor_beam_thickness        1.6
cursor_blink_interval        0.5
cursor_stop_blinking_after   10

# =========================
# DISPLAY SERVER
# =========================
linux_display_server wayland

# =========================
# SCROLLBACK / UX
# =========================
scrollback_lines     5000
wheel_scroll_min_lines 1

# =========================
# SOUND OFF
# =========================
enable_audio_bell no

# =========================
# WINDOW — APPLE FEEL
# =========================
window_padding_width     14
# Bordes redondeados (requiere compositor)
# En Hyprland: rounding = 12 en tu config
confirm_os_window_close  0

# Tab bar estilo macOS
#tab_bar_style            powerline
#tab_powerline_style      slanted
#tab_bar_min_tabs         1
#tab_bar_edge             top
#active_tab_font_style    bold
#inactive_tab_font_style  normal

# =========================
# COLORS EXTERNAL FILE
# =========================
include colors.conf
