# --- SECCIÓN DE WALLPAPER ANTIGUO ---
# Comentamos (o borramos) swww porque ya no lo usaremos
# exec-once = swww-daemon
# exec-once = bash -c "sleep 1 && swww img ~/.config/hypr/wallpapers/wall-05.png"

# Recarga final (opcional, si ves que el fondo tarda en aparecer)
exec-once = sleep 2 && hyprctl reload


# --- SECCIÓN DE WALLPAPER (Wallpaper Engine) ---
# Monitor Principal (280Hz)
exec-once = sleep 2 && SDL_VIDEODRIVER=wayland linux-wallpaperengine --screen-root DP-2 --fps 60 --scaling fill 3731170937

# Monitor Secundario (180Hz)
exec-once = sleep 3 && SDL_VIDEODRIVER=wayland linux-wallpaperengine --screen-root DP-3 --fps 60 --scaling fill 3731170937




# Configuración básica del sistema
exec-once = hypridle
exec-once = sleep 3 && waybar
exec-once = hyprctl setcursor Breeze_Light 24 
exec-once = hyprpm reload
exec-once = swaync








