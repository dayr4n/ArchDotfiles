# windowrule = rounding 0, floating:0, onworkspace:f[1]




# Monitor principal (DP-2)
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2

# Monitor secundario (DP-3)
workspace = 5, monitor:DP-3
workspace = 6, monitor:DP-3
workspace = 7, monitor:DP-3
workspace = 8, monitor:DP-3



# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # --- 🎨 Adiós al Branding (Escritorio Limpio) ---
    disable_hyprland_logo = true         # Elimina el logo y la "anime girl" del fondo
    disable_splash_rendering = true      # Elimina los mensajes de texto al iniciar
    force_default_wallpaper = 0          # Asegura que no se renderice ningún fondo por defecto
    background_color = 0x111111          # Color sólido de fondo (si falla el wallpaper engine)

    # --- 🚀 Rendimiento y Pantalla ---
    #vrr = 1                              # Adaptive Sync (G-Sync/FreeSync) siempre activo
    #vfr = true                           # Variable Frame Rate (ahorra GPU, mejora fluidez)
    
    # --- 💤 Gestión de Energía (Wake up) ---
    mouse_move_enables_dpms = true       # Despierta el monitor al mover el ratón
    key_press_enables_dpms = true        # Despierta el monitor al pulsar una tecla

    # --- 🧠 Usabilidad Pro ---
    focus_on_activate = true             # La ventana que abres toma el foco inmediatamente
    initial_workspace_tracking = 1       # La app se abre en el workspace donde la lanzaste
    middle_click_paste = false           # Desactiva pegar con el click central (opcional, evita errores)
    animate_manual_resizes = true        # Animación suave al cambiar tamaño de ventanas
}


