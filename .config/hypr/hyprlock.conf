$hypr = ~/.config/hypr
source = $hypr/colors.conf

$font = SF Pro Display
$font_bold = SF Pro Display Bold

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# ANIMATIONS (Optimizado para alta tasa de refresco)
animations {
    enabled = true
    # Un bezier mucho más directo y rápido
    bezier = quickOut, 0.2, 1, 0.3, 1
    
    animation = fadeIn, 1, 3, quickOut
    animation = fadeOut, 1, 3, quickOut
    # Aquí está el truco: bajamos de 4 a 1.5 y usamos quickOut
    animation = inputFieldDots, 1, 1.5, quickOut
    animation = inputFieldColors, 1, 2, quickOut
}
# BACKGROUND (Efecto cristal profundo)
background {
    monitor = 
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3 # Aumentado para más suavidad
    blur_size = 8
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# TIME (Más grande y estilizado)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = $font_bold
    shadow_pass = 3
    shadow_size = 4
    shadow_color = rgb(0,0,0)
    shadow_boost = 0.5
    position = 0, -120
    halign = center
    valign = top
}

# DATE (Substutil de la hora)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = rgba(255, 255, 255, 0.7)
    font_size = 25
    font_family = $font
    position = 0, -310
    halign = center
    valign = top
}

# USER AVATAR (Esto le da el toque PRO)
# Nota: Pon una foto tuya en ~/.config/hypr/face.png o cambia la ruta
image {
    monitor =
    path = ~/.config/hypr/face.png
    size = 120
    rounding = -1 # Círculo perfecto
    border_size = 2
    border_color = rgba(255, 255, 255, 0.2)
    rotate = 0
    reload_time = -1
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD (Estilo Glassmorphism moderno)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    dots_fade_time = 80 # Milisegundos (por defecto son 200, esto es el triple de rápido)
    
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.4) # Fondo semi-transparente
    font_color = rgba(255, 255, 255, 0.9)
    
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Bienvenido de nuevo, $USER</i>
    hide_input = false
    rounding = 15
    
    check_color = rgba(139, 233, 253, 0.8) 
    fail_color = rgba(255, 85, 85, 0.8)
    fail_text = <i>$PAMFAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    
    position = 0, -40
    halign = center
    valign = center
}

# BOTÓN DE INFORMACIÓN (Estilo Minimal)
label {
    monitor =
    text = 󰌾 Bloqueado por Seguridad
    color = rgba(255, 255, 255, 0.4)
    font_size = 10
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
